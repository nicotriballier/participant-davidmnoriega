name: Augment Code Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  augment-review:
    name: AI Code Review
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/auggieReview')
    runs-on: ubuntu-latest

    steps:
      - name: Acknowledge Review Request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.issue.pull_request.head_ref }}

      - name: Get PR Details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('base', pr.data.base.sha);
            core.setOutput('head', pr.data.head.sha);

      - name: Get Changed Files
        id: changes
        run: |
          echo "files=$(git diff --name-only ${{ steps.pr.outputs.base }}..${{ steps.pr.outputs.head }} | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Run Augment Code Review
        uses: augmentcode/review-pr@v0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          augment_session_auth: ${{ secrets.AUGMENT_SESSION_AUTH }}
          pull_number: ${{ github.event.issue.number }}
          repo_name: ${{ github.repository }}

      - name: Mark Complete
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const reaction = '${{ job.status }}' === 'success' ? 'rocket' : 'confused';
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: reaction
            });
